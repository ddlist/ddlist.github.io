<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Tickets | DDList</title>
<meta name="description" content="Submit a help ticket to get support for DDList scripts, templates, and services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --line: #e4e6eb; --ink: #171a21; --muted: #6b7280;
    --accent: #2b59ff; --on-ink: #ffffff; --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --surface: #171a20; --line: #262a33; --ink: #eceef2; --muted: #8b92a0;
      --accent: #7c9bff; --on-ink: #0f1115;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a20; --line: #262a33; --ink: #eceef2; --muted: #8b92a0;
    --accent: #7c9bff; --on-ink: #0f1115;
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topnav {
    max-width: 1320px; margin: 0 auto; padding: 20px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topnav a { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .topnav a:hover { color: var(--accent); }
  .topnav a svg { width: 16px; height: 16px; }

  .page {
    max-width: 640px; margin: 0 auto; padding: 40px 24px 64px;
  }
  .page h1 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 6px; }
  .page .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 32px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; box-shadow: 0 1px 2px rgba(23,26,33,.04), 0 8px 24px -12px rgba(23,26,33,.12);
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-group label { font-size: 13px; font-weight: 600; }
  .form-group input, .form-group textarea {
    height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 14px;
    transition: border-color .15s;
  }
  .form-group textarea { height: 140px; padding: 12px 14px; resize: vertical; }
  .form-group input:focus, .form-group textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 44px; padding: 0 22px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: var(--font); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.primary:hover { opacity: .88; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .btn-row { display: flex; gap: 10px; margin-top: 24px; }

  .success-msg {
    display: none; text-align: center; padding: 40px 20px;
  }
  .success-msg svg { width: 56px; height: 56px; color: var(--accent); margin-bottom: 16px; }
  .success-msg h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .success-msg p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  @media (max-width: 520px) {
    .form-row { grid-template-columns: 1fr; }
    .page { padding: 24px 16px 48px; }
    .card { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back to DDList
  </a>
</nav>

<div class="page">
  <h1>Support</h1>
  <p class="subtitle">Having trouble? Submit a ticket and we'll get back to you.</p>

  <div class="card" id="ticketForm">
    <form id="supportForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="subject">Subject *</label>
        <input type="text" id="subject" placeholder="Brief summary of the issue" required>
      </div>
      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" placeholder="Describe your issue in detail..." required></textarea>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn primary" id="submitBtn">Submit Ticket</button>
      </div>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
    <h2>Ticket Submitted</h2>
    <p>We've received your request and will respond as soon as possible.</p>
    <button class="btn" onclick="resetForm()">Submit Another</button>
  </div>
</div>

<footer style="max-width:1320px;margin:0 auto;padding:24px 24px 48px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);">
  <span>&copy; 2026 DDList &mdash; SHA REEQ</span>
  <nav style="display:flex;gap:16px;">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy</a>
    <a href="disclaimer.html">Disclaimer</a>
    <a href="admin.html">Admin</a>
  </nav>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
(function () {
  "use strict";

  var form = document.getElementById("supportForm");
  var formCard = document.getElementById("ticketForm");
  var successMsg = document.getElementById("successMsg");
  var submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    var ticket = {
      user: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      subject: document.getElementById("subject").value.trim(),
      message: document.getElementById("message").value.trim(),
      date: new Date().toISOString().slice(0, 10),
      status: "open"
    };

    db.collection("tickets").add(ticket).then(function () {
      formCard.style.display = "none";
      successMsg.style.display = "block";
    }).catch(function (err) {
      alert("Failed to submit ticket: " + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Ticket";
    });
  });

  window.resetForm = function () {
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Ticket";
    formCard.style.display = "";
    successMsg.style.display = "none";
  };
})();
</script>
</body>
</html>
